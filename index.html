/* Variables de marca (contrato). El tema se cambia con data-brand en <html>. */
:root{
  --tinta:#1c2333; --gris:#6b7280; --linea:#e5e8f0; --fondo:#f4f6fa; --blanco:#fff;
  --ok:#3FA66B; --alerta:#E8A33D; --error:#D9534F;
}
[data-brand="forguard"]{
  --marca:#0A1B4D; --marca-2:#12266B; --marca-suave:#EEF2FB; --marca-borde:#C9D4EC; --acento:#3E7FD6;
}
[data-brand="plato"]{
  --marca:#004B32; --marca-2:#00634A; --marca-suave:#EDF3EF; --marca-borde:#BFD6C9; --acento:#548D6C;
}

/* Registrar las variables de color permite que los degradados también hagan transición.
   Si el navegador no lo soporta, el cambio de color simplemente es instantáneo. */
@property --marca      { syntax:"<color>"; inherits:true; initial-value:#0A1B4D; }
@property --marca-2    { syntax:"<color>"; inherits:true; initial-value:#12266B; }
@property --marca-suave{ syntax:"<color>"; inherits:true; initial-value:#EEF2FB; }
@property --marca-borde{ syntax:"<color>"; inherits:true; initial-value:#C9D4EC; }
@property --acento     { syntax:"<color>"; inherits:true; initial-value:#3E7FD6; }
html{ transition:--marca .3s ease, --marca-2 .3s ease, --marca-suave .3s ease, --marca-borde .3s ease, --acento .3s ease; }

*{margin:0; padding:0; box-sizing:border-box;}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:var(--fondo); color:var(--tinta); min-height:100vh;
  display:flex; flex-direction:column; position:relative;
  transition:background-color .3s ease, color .3s ease;
}
/* Velo de color de la marca en la parte superior de la página. */
.hub-velo{
  position:fixed; inset:0 0 auto 0; height:520px; z-index:0; pointer-events:none;
  background-color:var(--marca-suave);
  -webkit-mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%);
          mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%);
  transition:background-color .3s ease;
}
.hub-cabecera, .hub-hero, .hub-main, .hub-pie{position:relative; z-index:1;}

/* ---------- Encabezado ---------- */
.hub-cabecera{
  background:var(--blanco); border-bottom:1px solid var(--linea);
  padding:13px 24px; display:flex; align-items:center; gap:14px;
  position:sticky; top:0; z-index:50;
  transition:background-color .3s ease, border-color .3s ease;
}
.hub-cabecera::before{
  content:""; position:absolute; inset:0 0 auto 0; height:3px;
  background:linear-gradient(90deg, var(--marca), var(--acento));
}
.hub-cabecera img{height:28px; width:auto; max-width:150px; object-fit:contain;}
.hub-cabecera .hub-marca-nombre{
  font-size:14px; font-weight:600; color:var(--marca); letter-spacing:.01em;
  padding-left:14px; border-left:1px solid var(--linea);
  transition:color .3s ease, border-color .3s ease;
}
.hub-cabecera .hub-etiqueta{margin-left:auto; font-size:12px; color:var(--gris); letter-spacing:.04em; text-align:right;}

/* ---------- Hero ---------- */
.hub-hero{padding:52px 24px 6px; text-align:center;}
.hub-hero h1{font-size:30px; font-weight:700; color:var(--marca); transition:color .3s ease;}
.hub-hero h1 span{
  background:linear-gradient(90deg, var(--marca-2), var(--acento));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
}
.hub-hero p{margin-top:10px; font-size:15px; color:var(--gris); max-width:540px; margin-inline:auto; line-height:1.55;}

/* ---------- Interruptor de marca (estilo iOS) ---------- */
.hub-switch-zona{display:flex; flex-direction:column; align-items:center; gap:10px; padding:26px 24px 4px; position:relative; z-index:1;}
.hub-switch{
  position:relative; display:flex; align-items:stretch;
  width:clamp(224px, 74vw, 292px); height:64px; padding:6px;
  border:none; border-radius:999px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  background:linear-gradient(135deg, var(--marca), var(--marca-2));
  box-shadow:0 10px 26px rgba(10,27,77,.20), inset 0 1px 3px rgba(0,0,0,.22);
  transition:box-shadow .3s ease;
  font-family:inherit;
}
.hub-switch:hover{box-shadow:0 12px 30px rgba(10,27,77,.26), inset 0 1px 3px rgba(0,0,0,.22);}
.hub-switch:focus-visible{outline:3px solid var(--acento); outline-offset:4px;}
.hub-perilla{
  position:absolute; top:6px; left:6px;
  width:calc((100% - 12px) / var(--n, 2)); height:calc(100% - 12px);
  border-radius:999px; background:var(--blanco);
  box-shadow:0 3px 10px rgba(10,27,77,.30);
  transform:translateX(calc(var(--i, 0) * 100%));
  transition:transform .34s cubic-bezier(.22,1,.36,1);
}
.hub-lado{position:relative; z-index:1; flex:1 1 0; display:grid; place-items:center; min-width:0;}
.hub-lg{position:absolute; max-height:30px; max-width:76%; width:auto; object-fit:contain; transition:opacity .3s ease;}
.hub-lg-color{opacity:0;}
.hub-lg-inv{opacity:.82;}
.hub-lado[data-activo="1"] .hub-lg-color{opacity:1;}
.hub-lado[data-activo="1"] .hub-lg-inv{opacity:0;}
.hub-blanquear{filter:brightness(0) invert(1);}
.hub-switch-pie{font-size:12.5px; color:var(--gris);}
.hub-switch-pie b{color:var(--marca); font-weight:600; transition:color .3s ease;}
.hub-oculto{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;}

/* ---------- Tarjetas ---------- */
.hub-main{flex:1; width:100%; max-width:1020px; margin:0 auto; padding:30px 24px 64px;}
.hub-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px;}

.hub-tarjeta{
  background:var(--blanco); border:1px solid var(--linea); border-radius:16px;
  padding:26px 24px 22px; display:flex; flex-direction:column; gap:12px;
  text-decoration:none; color:inherit; position:relative; overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease, border-color .3s ease, background-color .3s ease;
  animation:hub-aparece .34s cubic-bezier(.22,1,.36,1) both;
  animation-delay:var(--d, 0ms);
}
@keyframes hub-aparece{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
.hub-tarjeta::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg, var(--marca), var(--acento));}
.hub-tarjeta .hub-icono{
  width:46px; height:46px; border-radius:12px; display:grid; place-items:center;
  background:linear-gradient(135deg, var(--marca-2), var(--acento)); color:var(--blanco); flex-shrink:0;
}
.hub-tarjeta .hub-icono svg{width:24px; height:24px;}
.hub-tarjeta h2{font-size:17px; font-weight:600; color:var(--marca); transition:color .3s ease;}
.hub-tarjeta p{font-size:13px; color:var(--gris); line-height:1.55; flex:1;}
.hub-tarjeta .hub-cta{font-size:13px; font-weight:600; color:var(--acento); display:flex; align-items:center; gap:6px; transition:color .3s ease;}
.hub-tarjeta .hub-cta::after{content:"→"; transition:transform .15s ease;}

a.hub-tarjeta:hover{transform:translateY(-3px); box-shadow:0 10px 28px rgba(10,27,77,.10); border-color:var(--marca-borde);}
a.hub-tarjeta:hover .hub-cta::after{transform:translateX(3px);}
a.hub-tarjeta:focus-visible{outline:3px solid var(--acento); outline-offset:3px;}

.hub-tarjeta.hub-pronto{pointer-events:none;}
.hub-tarjeta.hub-pronto::before{background:var(--linea);}
.hub-tarjeta.hub-pronto .hub-icono{background:#eef1f7; color:#a3aabb;}
.hub-tarjeta.hub-pronto h2{color:#8a90a3;}
.hub-tarjeta .hub-insignia{
  position:absolute; top:16px; right:16px; font-size:11px; font-weight:600; color:var(--gris);
  background:var(--fondo); border:1px solid var(--linea); border-radius:999px; padding:4px 10px;
}

/* ---------- Pie ---------- */
.hub-pie{
  padding:20px 24px; text-align:center; font-size:12px; color:var(--gris);
  border-top:1px solid var(--linea); background:var(--blanco);
  transition:background-color .3s ease, border-color .3s ease;
}

/* ---------- Responsive ---------- */
@media (max-width:640px){
  .hub-cabecera{padding:11px 16px; gap:10px;}
  .hub-cabecera .hub-etiqueta{display:none;}
  .hub-hero{padding:36px 18px 4px;}
  .hub-hero h1{font-size:24px;}
  .hub-hero p{font-size:14px;}
  .hub-switch-zona{padding:22px 18px 2px;}
  .hub-switch{height:58px;}
  .hub-main{padding:24px 16px 48px;}
  .hub-grid{grid-template-columns:1fr;}
}

@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>
</head>

const ORDEN = Object.keys(BRANDS);

/* ---------- Estado ---------- */
const estado = { marca:ORDEN[0] };

/* ---------- Memoria del navegador (puede estar bloqueada) ---------- */
const LLAVE_MARCA = 'marca_activa';
function leerMarcaGuardada(){
  try{ const v = localStorage.getItem(LLAVE_MARCA); return (v && BRANDS[v]) ? v : null; }catch(e){ return null; }
}
function guardarMarca(id){
  try{ localStorage.setItem(LLAVE_MARCA, id); }catch(e){}
}

/* ---------- Pintado ---------- */
function pintarSwitch(){
  const sw = $('switchMarca');
  const i  = Math.max(0, ORDEN.indexOf(estado.marca));

  if(!sw.dataset.armado){
    let h = '<span class="hub-perilla" aria-hidden="true"></span>';
    ORDEN.forEach(id=>{
      const b = BRANDS[id];
      h += '<span class="hub-lado" data-marca="'+esc(b.id)+'">'
         +   '<img class="hub-lg hub-lg-color" src="'+b.logo+'" alt="">'
         +   '<img class="hub-lg hub-lg-inv'+(b.logoBlanco?'':' hub-blanquear')+'" src="'+(b.logoBlanco||b.logo)+'" alt="">'
         + '</span>';
    });
    sw.innerHTML = h;
    sw.dataset.armado = '1';
  }

  sw.style.setProperty('--n', ORDEN.length);
  sw.style.setProperty('--i', i);
  sw.setAttribute('aria-checked', i > 0 ? 'true' : 'false');
  sw.setAttribute('aria-describedby', 'ayudaSwitch');
  sw.querySelectorAll('.hub-lado').forEach(el=>{
    el.setAttribute('data-activo', el.getAttribute('data-marca') === estado.marca ? '1' : '0');
  });
}

function pintarTarjetas(){
  const b = BRANDS[estado.marca];
  $('gridTarjetas').innerHTML = b.tarjetas.map((t, i)=>{
    const svg = '<div class="hub-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
              + (ICONOS[t.icono] || ICONOS.ficha) + '</svg></div>';
    const cuerpo = svg
              + '<h2>'+esc(t.titulo)+'</h2>'
              + '<p>'+esc(t.desc)+'</p>';
    const retraso = ' style="--d:'+(i*55)+'ms"';
    return t.href
      ? '<a class="hub-tarjeta" href="'+esc(t.href)+'"'+retraso+'>'+cuerpo+'<span class="hub-cta">'+esc(t.cta || 'Abrir')+'</span></a>'
      : '<div class="hub-tarjeta hub-pronto"'+retraso+'><span class="hub-insignia">Próximamente</span>'+cuerpo+'</div>';
  }).join('');
}

function render(){
  const b = BRANDS[estado.marca];

  document.documentElement.setAttribute('data-brand', b.id);
  document.title = b.heroTitulo + ' · ' + b.nombre;

  $('logoCabecera').src = b.logo;
  $('logoCabecera').alt = b.nombre;
  $('nombreCabecera').textContent = b.nombre;
  $('etiquetaCabecera').textContent = b.etiqueta;

  $('heroTitulo').innerHTML = esc(b.heroTitulo) + ' <span>' + esc(b.heroResalte) + '</span>';
  $('heroSub').textContent = b.heroSub;
  $('marcaActivaTexto').textContent = b.nombre;

  $('pieTexto').textContent = '© ' + b.nombre + (b.razon && b.razon !== b.nombre ? ' · ' + b.razon : '')
    + ' · Uso interno — se prohíbe la reproducción o uso del sistema sin consentimiento.';

  pintarSwitch();
  pintarTarjetas();
}

/* ---------- Cambio de marca ---------- */
function cambiarMarca(id){
  if(!BRANDS[id] || id === estado.marca) return;
  estado.marca = id;
  guardarMarca(id);
  render();
}
function moverMarca(paso){
  const i = ORDEN.indexOf(estado.marca);
  cambiarMarca(ORDEN[(i + paso + ORDEN.length) % ORDEN.length]);
}

$('switchMarca').addEventListener('click', ev=>{
  const lado = ev.target.closest ? ev.target.closest('.hub-lado') : null;
  if(lado && lado.getAttribute('data-marca') !== estado.marca) cambiarMarca(lado.getAttribute('data-marca'));
  else if(!lado || ORDEN.length === 2) moverMarca(1);
});
$('switchMarca').addEventListener('keydown', ev=>{
  if(ev.key === 'ArrowRight' || ev.key === 'ArrowDown'){ ev.preventDefault(); moverMarca(1); }
  else if(ev.key === 'ArrowLeft' || ev.key === 'ArrowUp'){ ev.preventDefault(); moverMarca(-1); }
  else if(ev.key === 'Home'){ ev.preventDefault(); cambiarMarca(ORDEN[0]); }
  else if(ev.key === 'End'){ ev.preventDefault(); cambiarMarca(ORDEN[ORDEN.length-1]); }
});

/* ---------- Arranque ---------- */
estado.marca = leerMarcaGuardada() || ORDEN[0];
render();
</script>

</body>
</html>
